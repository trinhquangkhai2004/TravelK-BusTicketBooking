# H2 Database (In-memory)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Redis (Mock ho?c Embedded - ? ?ây ta dùng Mock trong Test Code ho?c b? qua n?u không c?n thi?t)
# N?u Integration Test c?n Redis th?t, b?n ph?i dùng Testcontainers.
# ?? ??n gi?n, ta có th? disable Redis ho?c dùng c?u hình gi?.
spring.data.redis.host=localhost
spring.data.redis.port=6379

