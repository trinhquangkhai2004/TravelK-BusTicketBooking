services:
  # MySQL
  db_mysql:
    image: mysql:8.0
    container_name: travelK_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: bus_reservation_db
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - travelK_net

    # Redis
  cache_redis:
    image: redis
    container_name: travelK-redis
    ports:
      - "6379:6379"
    networks:
      - travelK_net

    # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: travelK-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - travelK_net

    # Prometheus & Grafana
  prometheus:
    image: prom/prometheus:latest
    container_name: travelK-monitor-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - travelK_net

  grafana:
    image: grafana/grafana:latest
    container_name: travelK-monitor-grafana
    ports:
      - "3001:3000"
    networks:
      - travelK_net

  bus_app:
    build: .
    container_name: travelK-bus-ticket-booking
    ports:
      - "8080:8080"
    depends_on:
      - db_mysql
      - cache_redis
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db_mysql:3306/bus_reservation_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_DATA_REDIS_HOST: cache_redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    networks:
      - travelK_net

  # Frontend
  frontend:
    build: ./frontend
    container_name: travelK-frontend
    ports:
      - "3000:80"
    depends_on:
      - bus_app
    networks:
      - travelK_net

networks:
  travelK_net:
    driver: bridge
volumes:
  mysql_data: