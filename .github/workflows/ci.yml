name: TravelK Backend CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  IMAGE_NAME: issacquang/travelk-backend

jobs:
  # ── JOB 1: Build & Test Java ──────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven                      # Cache Maven → tiết kiệm 2-3 phút

      - name: Run Tests
        run: mvn clean verify --no-transfer-progress

      - name: Upload Test Report            # Lưu report dù pass hay fail
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: target/surefire-reports/
          retention-days: 7

  # ── JOB 2: Build Docker & Push ────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test                             # Chỉ chạy nếu test PASS
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'   # Chỉ push khi merge vào master, không push khi PR

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR (skip test vì đã test ở job trên)
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata      # Tự động tạo tags thông minh
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short  
            type=raw,value={{date 'YYYYMMDD-HHmm'}}

      - name: Set up Docker Buildx         # Hỗ trợ cache layer
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha             # Cache Docker layers → build nhanh hơn
          cache-to: type=gha,mode=max

      - name: Print Image Info
        run: |
          echo "Image pushed thành công!"
          echo "Tags: ${{ steps.meta.outputs.tags }}"